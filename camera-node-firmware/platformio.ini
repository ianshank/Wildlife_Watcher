; PlatformIO project for the Wildlife Watcher camera node firmware.
; Target: Seeed Studio XIAO ESP32S3 Sense, talking I2C to a Grove Vision AI V2.

[env:seeed_xiao_esp32s3]
platform = espressif32@6.7.0
board = seeed_xiao_esp32s3
framework = arduino

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Upload
upload_speed = 460800

; PSRAM is present on the Sense variant; enable it.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3

; Library dependencies
lib_deps =
    ; Seeed's SSCMA driver — talks to Grove Vision AI V2 over I2C/UART
    Seeed-Studio/Seeed_Arduino_SSCMA @ ^1.0.0
    ; MQTT client
    knolleary/PubSubClient @ ^2.8
    ; JSON serialization
    bblanchon/ArduinoJson @ ^6.21.5
    ; Base64 (we encode JPEG thumbnails)
    densaugeo/base64 @ ^1.4.0

[env:integration_test]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -D HIL_TEST_MODE=1

