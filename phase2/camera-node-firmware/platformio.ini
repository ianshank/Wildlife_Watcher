; Phase 2 firmware tree for PIR wake and modular camera-node experimentation.

[env:seeed_xiao_esp32s3]
platform = espressif32@6.7.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DWILDLIFE_CLASS_DEBOUNCE_MS=2000UL
    -DWILDLIFE_HEARTBEAT_MS=30000UL
    -DWILDLIFE_THUMB_PUBLISH_THRESHOLD=50U
    -DWILDLIFE_MAX_THUMB_BYTES=16384U
    -DWILDLIFE_POWER_MODE=0
    -DWILDLIFE_PIR_PIN=2
    -DWILDLIFE_DEEP_SLEEP_S=120UL
    -DWILDLIFE_DETECTION_TOPIC_ROOT=\"wildlife/detections\"
    -DWILDLIFE_STATUS_TOPIC_ROOT=\"wildlife/status\"
    -DWILDLIFE_THUMBS_TOPIC_ROOT=\"wildlife/thumbs\"
lib_deps =
    Seeed-Studio/Seeed_Arduino_SSCMA @ ^1.0.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.5
    densaugeo/base64 @ ^1.4.0

[env:seeed_xiao_esp32s3_pir]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -DWILDLIFE_POWER_MODE=1
    -DWILDLIFE_DEEP_SLEEP_S=120UL

[env:native]
platform = native
build_flags =
    -std=c++17
test_framework = unity
build_src_filter =
    -<src/main.cpp>
    -<src/net_wifi.cpp>
    -<src/net_mqtt.cpp>
    -<src/sscma_io.cpp>
    -<src/power_mgmt.cpp>