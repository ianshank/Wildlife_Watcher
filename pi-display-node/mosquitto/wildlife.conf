# /etc/mosquitto/conf.d/wildlife.conf
# Wildlife Watcher MQTT broker configuration.

# Listen on the LAN, not just localhost.
listener 1883 0.0.0.0

# Disable the default unauthenticated listener.
allow_anonymous false
password_file /etc/mosquitto/wildlife.passwd

# Persist retained messages and queued QoS 1/2 across restarts.
# (Debian's base mosquitto.conf already defines this)
# persistence true
# persistence_location /var/lib/mosquitto/

# Logging.
# (Debian's base mosquitto.conf already defines log_dest)
# log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Allow JPEG thumbnails (base64-encoded, ~16 KB) without complaint.
message_size_limit 65536

# Modest queue depth — the kiosk subscribes promptly so we don't need much.
max_queued_messages 100
