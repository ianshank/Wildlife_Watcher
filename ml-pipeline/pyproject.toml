[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildlife-ml-pipeline"
version = "0.1.0"
description = "Wildlife Watcher Phase 3 training and export scaffold"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.131.0",
    "mypy>=1.15.0",
    "onnxruntime>=1.18.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "RUF", "SIM", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["onnxruntime"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["wildlife_ml"]
omit = [
    "*/wildlife_ml/train/*",
    "*/wildlife_ml/runtime/onnx_smoke.py",
    "*/wildlife_ml/runtime/__init__.py",
    "*/wildlife_ml/export/tflite.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
