name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      WILDLIFE_CONFIG: pi-display-node/kiosk/test_config.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Harness quality gate
        run: python .agents/harness/orchestrator.py quality --verbose

  ml-pipeline-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: ML pipeline lint
        run: python .agents/harness/orchestrator.py ml-pipeline-lint --verbose

      - name: ML pipeline typecheck
        run: python .agents/harness/orchestrator.py ml-pipeline-typecheck --verbose

      - name: ML pipeline tests
        run: python .agents/harness/orchestrator.py ml-pipeline-test --verbose

      - name: ML pipeline smoke
        run: python .agents/harness/orchestrator.py ml-pipeline-smoke --verbose

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt platformio

      - name: Build firmware baseline
        run: python .agents/harness/orchestrator.py firmware-build --verbose

      - name: Build firmware phase2
        run: python .agents/harness/orchestrator.py firmware-build-phase2 --verbose

      - name: Test firmware phase2 native
        run: python .agents/harness/orchestrator.py firmware-test-native --verbose