name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      WILDLIFE_CONFIG: pi-display-node/kiosk/test_config.yaml
      PYTHONPATH: pi-display-node/kiosk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check pi-display-node/kiosk pi-display-node/tests .agents/harness/orchestrator.py

      - name: Mypy
        run: python -m mypy pi-display-node/kiosk/wildlife_kiosk.py .agents/harness/orchestrator.py

      - name: Pytest
        run: python -m pytest --cov=pi-display-node/kiosk --cov-report=term-missing --cov-fail-under=70

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Build firmware
        run: platformio run -d camera-node-firmware